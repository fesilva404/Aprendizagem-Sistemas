<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Vestido Assimétrico -->
  <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Decote assimétrico -->
    <path d="M60 40 L85 30 L100 55 L115 30 L140 40" fill="#1a1a1a" stroke="#1a1a1a"/>
    <!-- Corpo do vestido (assimétrico) -->
