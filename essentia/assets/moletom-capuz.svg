<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Moletom Com Capuz -->
  <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capuz -->
    <path d="M50 40 Q40 15 100 10 Q160 15 150 40 L150 55 Q165 70 160 80 L155 85 L145 80 L145 55" fill="#2a2a2a" stroke="#1a1a1a"/>
    <!-- Corpo -->
    <path d="M50 55 L35 80 L40 85 L50 80 L50 215 L150 215 L150 80 L160 85 L165 80 L150 55 L140 40 L120 50 L100 45 L80 50 L60 40 Z" fill="#3a3a3a" stroke="#1a1a1a"/>
    <!-- Bolso canguru -->
    <path d="M55 125 L70 145 L130 145 L145 125" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="55" y1="125" x2="145" y2="125" stroke="#555" stroke-width="2"/>
    <!-- Cordão do capuz -->
    <path d="M90 30 L85 22" stroke="#555" stroke-width="2" fill="none"/>
    <path d="M110 30 L115 22" stroke="#555" stroke-width="2" fill="none"/>
    <!-- Punho -->
    <line x1="35" y1="80" x2="35" y2="90" stroke="#555" stroke-width="3"/>
    <line x1="165" y1="80" x2="165" y2="90" stroke="#555" stroke-width="3"/>
    <!-- Barra inferior -->
    <line x1="50" y1="215" x2="150" y2="215" stroke="#555" stroke-width="3"/>
  </g>
</svg>

