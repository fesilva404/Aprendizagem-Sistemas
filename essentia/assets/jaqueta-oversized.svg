    <!-- Bolsos -->
    <rect x="55" y="130" width="30" height="35" rx="3" fill="none"/>
    <rect x="115" y="130" width="30" height="35" rx="3" fill="none"/>
    <!-- Abotoamento -->
    <circle cx="100" cy="105" r="3" fill="#1a1a1a"/>
    <circle cx="100" cy="125" r="3" fill="#1a1a1a"/>
    <circle cx="100" cy="145" r="3" fill="#1a1a1a"/>
