<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Jaqueta Oversized -->
  <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo principal -->
    <path d="M40 60 L30 95 L35 100 L40 95 L40 210 L160 210 L160 95 L165 100 L170 95 L160 60 L140 45 L120 55 L100 50 L80 55 L60 45 Z" fill="#2d2d2d" stroke="#1a1a1a"/>
