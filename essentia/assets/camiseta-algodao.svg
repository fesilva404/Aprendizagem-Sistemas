    <path d="M50 55 L35 80 L40 85 L50 80 L50 210 L150 210 L150 80 L160 85 L165 80 L150 55 L130 40 L115 50 L100 45 L85 50 L70 40 Z" fill="#e8e6e0" stroke="#1a1a1a"/>
